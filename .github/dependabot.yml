version: 2
# Pause routine version-update PRs. Zero does not disable security updates;
# those are controlled separately in the repository's security settings.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      # Node declarations must follow the runtime selected in CI/CD.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Halo 2.26 UI packages require vue-router ~5.1.0.
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
