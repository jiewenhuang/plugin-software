# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: software
spec:
  enabled: true
  requires: ">=2.25.0"
  pluginDependencies:
    ai-foundation?: ">=1.0.0-SNAPSHOT & <2.0.0"
  author:
    name: jiewenhuang
    website: https://github.com/jiewenhuang
  logo: logo.png
  homepage: https://github.com/jiewenhuang/plugin-software#readme
  repo: https://github.com/jiewenhuang/plugin-software
  issues: https://github.com/jiewenhuang/plugin-software/issues
  displayName: "软件中心"
  description: "为 Halo 提供软件目录、版本、下载源、分类标签与专题管理。"
  settingName: software-settings
  configMapName: software-config
  license:
    - name: "GPL-3.0"
      url: "https://github.com/jiewenhuang/plugin-software/blob/main/LICENSE"
